---
layout: default
---
<article class="page post">
  <a class="back" href="{{ '/blog/' | relative_url }}">{% include icon.html name="arrow-left" %}<span>Back to all posts</span></a>
  <h1 class="display single">{{ page.title }}</h1>
  <p class="note">&lt;!-- {{ page.date | date: "%B %-d, %Y" }} --&gt;</p>
  <div class="prose">
    {{ content }}
  </div>
</article>
